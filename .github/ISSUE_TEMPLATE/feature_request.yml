name: Feature request
description: Propose a focused improvement to AI Interfaces
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and roadmap notes for this request.
          required: true
        - label: I understand v1 is read-only and mutation capabilities require a separate security design.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the user or contributor problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Explain the desired behavior and how success could be verified.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Security and compatibility considerations
      description: Note effects on authority, tenant isolation, data exposure, APIs, or existing users.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
